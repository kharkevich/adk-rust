name: Diag managed Windows
on:
  push:
    branches: [ 'diag/**' ]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Setup Rust
      uses: ./.github/actions/setup-rust
      with:
        neutralize-wild: 'false'
        cache-key: cross-platform-test-windows-latest
        cache-shared-key: cross-platform-test
        cache-save: 'false'
    - name: Build the test
      run: cargo test -p adk-managed --test durable_round_trip_tests --no-run
    - name: Replica wake, default journal, three times
      shell: bash
      run: |
        for i in 1 2 3; do
          cargo test -p adk-managed --test durable_round_trip_tests -- --nocapture --exact a_result_sent_to_another_replica_wakes_the_run_on_sqlite 2>&1 | grep -E 'DIAG|test result|panicked|timed out' || true
        done
    - name: Replica wake, WAL, three times
      shell: bash
      run: |
        for i in 1 2 3; do
          cargo test -p adk-managed --test durable_round_trip_tests -- --nocapture --ignored --exact diag_replica_wake_on_sqlite_wal 2>&1 | grep -E 'DIAG|test result|panicked|timed out' || true
        done
